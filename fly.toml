app = 'analisis-datos-sii2-frontend'
primary_region = 'ams'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
[build.args]
  NEXT_PUBLIC_BACKEND_URL = "https://tu-api.com"